          "@type": "WebSite",

          "name": "QR Code Studio",
          "alternateName": ["QR Studio", "QR Code Generator"],
          "description": "A multilingual browser-based QR code generator and designer for links, contact details, locations, social profiles, text and custom data.",
          "inLanguage": ["en", "fi", "fa", "ar", "ru", "zh", "ko", "ja", "de", "es", "fr"]
        },
        {
          "@type": "WebApplication",
          "@id": "https://qrcode.imoein.com/#app",
          "name": "QR Code Studio",
          "url": "https://qrcode.imoein.com/",
          "description": "Create and customize static QR codes for websites, phone numbers, email, locations, social profiles, vCard contacts, text and mixed custom information.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires a modern JavaScript-enabled web browser",
          "isAccessibleForFree": true,
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "Website QR codes",
            "Phone and email QR codes",
            "Location QR codes",
            "Social profile QR codes",
            "vCard contact QR codes",

            "Mixed custom QR payloads",

            "Custom QR module and eye shapes",
            "Center logo support",

            "11 interface languages"
          ],

            "name": "imoein.com",

          },
          "isPartOf": { "@id": "https://qrcode.imoein.com/#website" }
        }
      ]
    }
    </script>

    <script>
      (() => {
        try {
          const saved = localStorage.getItem('qr-theme');
          const mode = saved === 'light' || saved === 'dark' || saved === 'auto' ? saved : 'auto';
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = mode === 'auto' ? (systemDark ? 'dark' : 'light') : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeMode = mode;
          document.documentElement.style.colorScheme = resolved;
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', resolved === 'dark' ? '#0a0d14' : '#f6f7fb');
        } catch {}
      })();
    </script>
